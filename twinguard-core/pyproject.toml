[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinguard-core"
version = "0.1.0"
description = "TwinGuard digital twin, simulation engine, policy classifier and agent layer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]
# Only needed by OpenAICompatibleProvider; the test suite never touches it.
llm = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["twinguard_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
